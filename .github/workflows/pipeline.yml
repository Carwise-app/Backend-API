name: Deploy Container
on:
  push:
    branches: [ development ]

env:
  GIN_MODE: release
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
  HOST: ${{ secrets.HOST }}
  PORT: ${{ secrets.PORT }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWD: ${{ secrets.DB_PASSWD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_HOST: ${{ secrets.DB_HOST }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  CAR_RECOGNITION_API_URL: ${{ secrets.CAR_RECOGNITION_API_URL }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
  GOOGLE_SCOPES: ${{ secrets.GOOGLE_SCOPES }}
  OAUTH2_STATE: ${{ secrets.OAUTH2_STATE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./src/api
  docker_deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
  
  deploy:
    needs: docker_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest

            echo "🚀 Pulling image: $IMAGE"
            docker pull $IMAGE
            
            echo "🧹 Stopping and removing old container if exists..."
            docker stop carwisegw || true
            docker rm carwisegw || true
            
            echo "🗑️ Pruning old images..."
            docker image prune -f

            echo "🚀 Running new container..."
            docker run -d \
              --name carwisegw \
              --restart always \
              -p 4040:4040 \
              -e GIN_MODE=release \
              -e HOST=${{ secrets.HOST }} \
              -e PORT=${{ secrets.PORT }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWD=${{ secrets.DB_PASSWD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
              -e SMTP_HOST=${{ secrets.SMTP_HOST }} \
              -e SMTP_PORT=${{ secrets.SMTP_PORT }} \
              -e SMTP_USER=${{ secrets.SMTP_USER }} \
              -e SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
              -e CAR_RECOGNITION_API_URL=${{ secrets.CAR_RECOGNITION_API_URL }} \
              -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              -e GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              -e GOOGLE_REDIRECT_URL=${{ secrets.GOOGLE_REDIRECT_URL }} \
              -e GOOGLE_SCOPES=${{ secrets.GOOGLE_SCOPES }} \
              -e OAUTH2_STATE=${{ secrets.OAUTH2_STATE }} \
              $IMAGE
